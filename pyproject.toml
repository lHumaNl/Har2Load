[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "har2load"
version = "0.2.0a1"
description = "Offline, loss-preserving HAR inspection and scenario preparation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
har2load = "har2load.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["har2load*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/har2load"]
